name: Deploy docs

# Publishes the docs site to GitHub Pages, which serves it at
# https://octans.dev — the custom domain is configured in the repo's
# Settings → Pages, not here.
#
# The site is the landing page at the root plus the built Storybook under
# /storybook/; `pnpm build-site` assembles both into site-dist.

on:
  push:
    branches: [main]
  # Manual redeploys, e.g. after changing the Pages configuration.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one, but never
# cancels a deployment that has already started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Kept in sync with "engines" in package.json.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
