<!--
  Injected into the Storybook manager's <head>. The favicon is the browser-tab
  identity of the docs site, which the theme's brandImage does not reach.

  No <title> here: Storybook rewrites the document title on every navigation
  ("Button - Docs ⋅ Storybook"), and a second static <title> would be ignored
  anyway — browsers honour the first one in the document.
-->
<link
  rel="icon"
  type="image/svg+xml"
  href="./octans-logo.svg"
/>
